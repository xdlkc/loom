<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loom · 管控台</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><aside><a class="brand" href="#overview"><span>⌘</span> Loom</a><small>LOCAL CONTROL</small><nav><button data-page="overview" class="active">概览</button><button data-page="requests">请求</button><button data-page="sessions">会话轨迹</button><button data-page="settings">采集设置</button></nav><footer><span class="dot"></span> 仅在本机保存<br><small id="version">Rust gateway</small></footer></aside><main><header><div><p class="eyebrow">OBSERVABILITY</p><h1 id="title">调用概览</h1></div><div class="actions"><span id="updated"></span><button id="refresh">刷新</button></div></header><section id="login" hidden><h2>连接本机 Loom</h2><p>在终端运行以下命令，浏览器会自动安全登录。</p><pre>loom console</pre><p class="muted">不需要在网页粘贴 API Key。</p></section><div id="error" role="alert" hidden></div><section id="filters"><label>时间<select id="range" aria-label="时间"><option value="24">最近 24 小时</option><option value="168">最近 7 天</option><option value="720">最近 30 天</option></select></label><label>供应商<select id="provider" aria-label="供应商"><option value="">全部供应商</option></select></label><label>模型<select id="model" aria-label="模型"><option value="">全部模型</option></select></label><label>Harness<select id="harness" aria-label="Harness"><option value="">全部 harness</option><option value="pi">pi</option><option value="opencode2">opencode2</option><option value="claude-code">Claude Code</option><option value="unknown">未识别</option></select></label></section><div id="content" aria-live="polite"></div><dialog id="detail"><div class="detail-head"><h2 id="detail-title">详情</h2><button id="close-detail" aria-label="关闭详情">关闭 ✕</button></div><div id="detail-content"></div></dialog><noscript>请启用 JavaScript，以查看本机请求和会话。</noscript></main></body></html>
