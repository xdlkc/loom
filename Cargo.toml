[package]
name = "loom"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "Local-only unified model gateway"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
subtle = "2"
rpassword = "7"
futures-util = "0.3"
async-stream = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
